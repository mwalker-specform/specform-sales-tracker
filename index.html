<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>SPECFORM SalesPartner</title><!-- v101 -->
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/prop-types@15.8.1/prop-types.min.js"></script>
<script src="https://unpkg.com/recharts@2.8.0/umd/Recharts.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  body { font-family: 'Segoe UI', system-ui, sans-serif; background:#f1f5f9; }
  .status-Won       { background:#dcfce7; color:#166534; }
  .status-Verbal    { background:#fef9c3; color:#854d0e; }
  .status-Lost      { background:#fee2e2; color:#991b1b; }
  .status-Duplicate { background:#f3f4f6; color:#6b7280; }
  .status-Unlikely  { background:#ede9fe; color:#5b21b6; }
  .status-NotAwarded{ background:#ffedd5; color:#9a3412; }
  .modal-backdrop   { position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;display:flex;align-items:center;justify-content:center; }
  .modal            { background:#fff;border-radius:12px;padding:28px;width:min(680px,95vw);max-height:90vh;overflow-y:auto; }
  input, select, textarea { border:1px solid #d1d5db;border-radius:6px;padding:6px 10px;width:100%;font-size:14px;outline:none; }
  input:focus, select:focus, textarea:focus { border-color:#2563eb;box-shadow:0 0 0 2px #bfdbfe; }
  .btn { padding:7px 16px;border-radius:7px;font-size:14px;font-weight:500;cursor:pointer;border:none; }
  .btn-primary { background:#1d4ed8;color:#fff; }
  .btn-primary:hover { background:#1e40af; }
  .btn-ghost { background:#f1f5f9;color:#374151; }
  .btn-ghost:hover { background:#e2e8f0; }
  .btn-danger { background:#dc2626;color:#fff; }
  .btn-danger:hover { background:#b91c1c; }
  .card { background:#fff;border-radius:12px;padding:20px;box-shadow:0 1px 3px rgba(0,0,0,.07); }
  .kpi-card { background:#fff;border-radius:12px;padding:20px 24px;box-shadow:0 1px 3px rgba(0,0,0,.07);border-left:4px solid; }
  tr:hover td { background:#f8fafc; }
  .tab { padding:8px 18px;border-radius:8px;cursor:pointer;font-weight:500;font-size:14px;white-space:nowrap; }
  .tab-active { background:#1d4ed8;color:#fff; }
  .tab-inactive { color:#64748b; }
  .tab-inactive:hover { background:#e2e8f0; }
  /* ── Splash ── */
  .splash { position:fixed;inset:0;background:#1F4E79;display:flex;align-items:center;justify-content:center;z-index:9999;transition:opacity 0.8s ease; }
  .splash.fade-out { opacity:0;pointer-events:none; }
  /* ── Mobile ── */
  .tabs-scroll { overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none; }
  .tabs-scroll::-webkit-scrollbar { display:none; }
  @media (max-width:640px) {
    .tab { padding:7px 12px;font-size:13px; }
    .modal { padding:16px; }
    .kpi-card { padding:12px 14px; }
    .kpi-card .text-2xl { font-size:1.2rem; }
  }
</style>
</head>
<body>
<div id="root"></div>
<script>
const { useState, useEffect, useCallback, useRef } = React;
const { BarChart, Bar, XAxis, YAxis, CartesianGrid, Tooltip, Legend, ResponsiveContainer, PieChart, Pie, Cell, ComposedChart, Area, Line, ReferenceLine, LabelList } = Recharts;

const API = '';
const STATUS_OPTIONS = ['Won','Verbal','Lost','Not Awarded','Unlikely','Duplicate'];
const STATUS_COLORS = { Won:'#16a34a', Verbal:'#ca8a04', Lost:'#dc2626', 'Not Awarded':'#ea580c', Unlikely:'#7c3aed', Duplicate:'#6b7280' };
const fmt = n => n == null ? '-' : '$' + Number(n).toLocaleString('en-US', {minimumFractionDigits:0,maximumFractionDigits:0});
const fmtDate = s => {
  if (!s) return '';
  // Only reformat ISO YYYY-MM-DD; leave "7/9/2026", "Jul 13, 2026", etc. as-is
  if (/^\d{4}-\d{2}-\d{2}/.test(s)) {
    const [y,m,d] = s.slice(0,10).split('-');
    return `${parseInt(m)}/${parseInt(d)}/${y}`;
  }
  return s;
};

function fireConfetti() {
  // Two cannons from the bottom corners
  const opts = { particleCount:60, spread:70, startVelocity:55, ticks:200,
                 colors:['#16a34a','#22c55e','#4ade80','#fbbf24','#f59e0b','#ffffff','#bbf7d0'] };
  confetti({ ...opts, origin:{x:0.1, y:1} });
  confetti({ ...opts, origin:{x:0.9, y:1} });
  setTimeout(() => {
    confetti({ ...opts, particleCount:40, spread:50, startVelocity:40, origin:{x:0.5, y:0.9} });
  }, 250);
}

// ── Field config ──────────────────────────────────────────────────────────────
const FIELDS = [
  {key:'status',       label:'Status',        type:'select'},
  {key:'date_received',label:'Date Received', type:'text'},
  {key:'date_quoted',  label:'Date Quoted',   type:'text'},
  {key:'sent_to',      label:'Sent To',       type:'text'},
  {key:'subject',      label:'Subject',       type:'text'},
  {key:'job_name',     label:'Job Name',      type:'text'},
  {key:'customer',     label:'Customer',      type:'text'},
  {key:'location',     label:'Location',      type:'text'},
  {key:'region',       label:'Region',        type:'select', options:['Central Texas','Southeast Texas','The Valley']},
  {key:'product',      label:'Product',       type:'textarea'},
  {key:'price',        label:'Price',         type:'text'},
  {key:'quantities',   label:'Quantities',    type:'text'},
  {key:'amount',       label:'Amount ($)',    type:'number'},
  {key:'close_date',   label:'Close Date',    type:'text'},
  {key:'est_freight',  label:'Est. Freight',  type:'text'},
  {key:'lead_time',    label:'Lead Time',     type:'text'},
  {key:'notes',        label:'Notes',         type:'textarea'},
];

// ── API helpers ───────────────────────────────────────────────────────────────
async function apiFetch(path, opts={}) {
  const token = localStorage.getItem('auth_token');
  const headers = { 'Content-Type':'application/json', ...(opts.headers||{}) };
  if (token) headers['Authorization'] = 'Bearer ' + token;
  const res = await fetch(API + path, { ...opts, headers });
  if (res.status === 401) {
    localStorage.removeItem('auth_token');
    window.location.reload();
    return;
  }
  if (!res.ok) throw new Error(await res.text());
  return res.json();
}

// ── Status badge ──────────────────────────────────────────────────────────────
function StatusBadge({ status }) {
  if (!status) return React.createElement('span', {className:'text-gray-400 text-xs'}, '—');
  const cls = 'status-' + status.replace(' ','');
  return React.createElement('span', {
    className: `text-xs font-semibold px-2 py-0.5 rounded-full ${cls}`
  }, status);
}

// ── API configs ───────────────────────────────────────────────────────────────
const RMAX_CFG = {
  quotesBase:    '/api/quotes',
  exportUrl:     '/api/quotes-export',
  syncUrl:       '/api/sync',
  dashboardBase: '/api/dashboard',
  label:         'RMAX',
  color:         '#1d4ed8',
};
const HYDROTECH_CFG = {
  quotesBase:    '/api/hydrotech-quotes',
  exportUrl:     '/api/hydrotech-quotes-export',
  syncUrl:       '/api/hydrotech-sync',
  dashboardBase: '/api/hydrotech-dashboard',
  label:         'Hydrotech',
  color:         '#16a34a',
  regions:       ['Southeast Texas'],
};
const GLASSWORKS_CFG = {
  quotesBase:    '/api/glassworks-quotes',
  exportUrl:     '/api/glassworks-quotes-export',
  syncUrl:       '/api/glassworks-sync',
  dashboardBase: '/api/glassworks-dashboard',
  label:         'Glassworks',
  color:         '#0e7490',
};

// ── Quote Modal ───────────────────────────────────────────────────────────────
function QuoteModal({ quote, onClose, onSave, quotesBase = '/api/quotes' }) {
  const [form, setForm] = useState(quote || {});
  const [saving, setSaving] = useState(false);
  const [companies, setCompanies] = useState([]);
  const [acSearch, setAcSearch] = useState('');
  const [acOpen, setAcOpen]   = useState(false);

  const set = (k,v) => setForm(f => ({...f,[k]:v}));

  useEffect(() => {
    apiFetch('/api/companies').then(cs => {
      setCompanies(cs);
      if (quote?.company_id) {
        const linked = cs.find(c => c.id === quote.company_id);
        if (linked) setAcSearch(linked.name);
      }
    }).catch(() => {});
  }, []);

  const acFiltered = acSearch
    ? companies.filter(c => c.name.toLowerCase().includes(acSearch.toLowerCase()))
    : companies;

  function selectCompany(co) {
    set('company_id', co ? co.id : null);
    setAcSearch(co ? co.name : '');
    setAcOpen(false);
  }

  async function save() {
    setSaving(true);
    try {
      const body = {...form, amount: form.amount ? parseFloat(form.amount) : null};
      const wasWon = quote && quote.status === 'Won';
      if (form.id) {
        await apiFetch(`${quotesBase}/${form.id}`, {method:'PUT', body:JSON.stringify(body)});
      } else {
        await apiFetch(quotesBase, {method:'POST', body:JSON.stringify(body)});
      }
      if (body.status === 'Won' && !wasWon) fireConfetti();
      onSave();
    } catch(e) { alert('Save failed: ' + e.message); }
    setSaving(false);
  }

  return React.createElement('div', {className:'modal-backdrop', onClick:e=>e.target===e.currentTarget&&onClose()},
    React.createElement('div', {className:'modal'},
      React.createElement('div', {className:'flex justify-between items-center mb-5'},
        React.createElement('h2', {className:'text-lg font-bold text-gray-800'}, form.id ? 'Edit Quote' : 'New Quote'),
        React.createElement('button', {onClick:onClose, className:'text-gray-400 hover:text-gray-600 text-2xl leading-none'}, '×')
      ),
      React.createElement('div', {className:'grid grid-cols-1 sm:grid-cols-2 gap-3'},
        FIELDS.flatMap(f => {
          const val = form[f.key] ?? '';
          let el;
          if (f.type === 'select') {
            const selOpts = f.options || STATUS_OPTIONS;
            el = React.createElement('select', {value:val, onChange:e=>set(f.key,e.target.value)},
              React.createElement('option', {value:''},'— None —'),
              selOpts.map(s => React.createElement('option',{key:s,value:s},s))
            );
          } else if (f.type === 'textarea') {
            el = React.createElement('textarea', {value:val, rows:2, onChange:e=>set(f.key,e.target.value)});
          } else {
            el = React.createElement('input', {type:f.type==='number'?'number':'text', value:val, onChange:e=>set(f.key,e.target.value)});
          }
          const wide = f.type==='textarea' || f.key==='subject' || f.key==='product';
          const fieldEl = React.createElement('div', {key:f.key, className:wide?'col-span-2':'col-span-1'},
            React.createElement('label', {className:'block text-xs font-medium text-gray-500 mb-1'}, f.label),
            el
          );

          // Inject "Linked to Account" combobox right after Customer field
          if (f.key === 'customer') {
            const linkedName = form.company_id
              ? (companies.find(c => c.id === form.company_id)?.name || acSearch)
              : '';
            const accountField = React.createElement('div', {key:'linked_account', className:'col-span-1', style:{position:'relative'}},
              React.createElement('label', {className:'block text-xs font-medium text-gray-500 mb-1'}, 'Linked to Account'),
              React.createElement('div', {style:{display:'flex', alignItems:'center', gap:'4px'}},
                React.createElement('input', {
                  type:'text',
                  value: acOpen ? acSearch : (linkedName || acSearch),
                  placeholder: 'Search company accounts…',
                  onFocus: () => { setAcOpen(true); setAcSearch(''); },
                  onChange: e => { setAcSearch(e.target.value); setAcOpen(true); },
                  onBlur: () => setTimeout(() => setAcOpen(false), 180),
                  style:{flex:1}
                }),
                form.company_id && React.createElement('button', {
                  type:'button',
                  onClick: () => selectCompany(null),
                  style:{background:'none', border:'none', color:'#94a3b8', cursor:'pointer',
                    fontSize:'18px', lineHeight:1, padding:'0 2px', flexShrink:0}
                }, '×')
              ),
              acOpen && React.createElement('div', {
                style:{position:'absolute', top:'100%', left:0, right:0, zIndex:200,
                  background:'#fff', border:'1px solid #d1d5db', borderRadius:'8px',
                  boxShadow:'0 6px 20px rgba(0,0,0,0.12)', maxHeight:'200px', overflowY:'auto', marginTop:'2px'}
              },
                acFiltered.length === 0
                  ? React.createElement('div', {style:{padding:'10px 14px', fontSize:'12px', color:'#94a3b8'}}, 'No matches')
                  : acFiltered.map(co => React.createElement('div', {
                      key: co.id,
                      onMouseDown: () => selectCompany(co),
                      style:{
                        padding:'8px 14px', cursor:'pointer', fontSize:'13px',
                        background: form.company_id === co.id ? '#EFF6FF' : '#fff',
                        fontWeight: form.company_id === co.id ? 600 : 400,
                        borderBottom: '1px solid #f8fafc'
                      }
                    },
                    React.createElement('div', {style:{color:'#1e293b'}}, co.name),
                    co.region && React.createElement('div', {style:{fontSize:'11px', color:'#64748b'}}, co.region)
                  ))
              )
            );
            return [fieldEl, accountField];
          }

          return [fieldEl];
        })
      ),
      React.createElement('div', {className:'flex justify-end gap-2 mt-6'},
        React.createElement('button', {className:'btn btn-ghost', onClick:onClose}, 'Cancel'),
        React.createElement('button', {className:'btn btn-primary', onClick:save, disabled:saving},
          saving ? 'Saving…' : 'Save Quote')
      )
    )
  );
}

// ── Confirm dialog ────────────────────────────────────────────────────────────
function Confirm({ message, onYes, onNo }) {
  return React.createElement('div', {className:'modal-backdrop'},
    React.createElement('div', {className:'modal', style:{maxWidth:380}},
      React.createElement('p', {className:'text-gray-700 mb-5'}, message),
      React.createElement('div', {className:'flex justify-end gap-2'},
        React.createElement('button', {className:'btn btn-ghost', onClick:onNo}, 'Cancel'),
        React.createElement('button', {className:'btn btn-danger', onClick:onYes}, 'Delete')
      )
    )
  );
}

// ── Dashboard view ────────────────────────────────────────────────────────────
function Dashboard({ cfg = RMAX_CFG }) {
  const [data, setData]                        = useState(null);
  const [selMonth, setSelMonth]                = useState('all');
  const [selRegionMonth, setSelRegionMonth]    = useState('avg');
  const [selPipelineMonth, setSelPipelineMonth]= useState('all');
  useEffect(() => { apiFetch(cfg.dashboardBase).then(setData).catch(console.error); }, [cfg.dashboardBase]);
  if (!data) return React.createElement('div', {className:'p-8 text-gray-400'}, 'Loading…');

  const { totals, by_location, by_region, by_region_month, by_month, by_close_month, by_status } = data;
  const hasRegions = !!(by_region && by_region.length > 0);

  // Build month lookup and sorted option list
  const monthMap = {};
  (by_month || []).forEach(r => { monthMap[r.month] = r; });
  const monthOptions = [...(by_month || [])].reverse();

  // Active stats — either a specific month or all-time totals
  const active = selMonth !== 'all' && monthMap[selMonth]
    ? {
        total_amount:  monthMap[selMonth].total,
        total_quotes:  monthMap[selMonth].total_quotes,
        won_amount:    monthMap[selMonth].won,
        won_count:     monthMap[selMonth].won_count,
        verbal_amount: monthMap[selMonth].verbal,
        verbal_count:  monthMap[selMonth].verbal_count,
        lost_amount:   monthMap[selMonth].lost,
        lost_count:    monthMap[selMonth].lost_count,
      }
    : totals;

  // Human-readable month label e.g. "Jul 2026"
  const monthLabel = selMonth !== 'all' && selMonth
    ? new Date(selMonth + '-02').toLocaleDateString('en-US',{month:'long',year:'numeric'})
    : 'All Time';

  const closureRate = (active.total_quotes || 0) > 0
    ? ((active.won_count / active.total_quotes) * 100).toFixed(1) + '%'
    : '—';
  const dollarClosureRate = (active.total_amount || 0) > 0
    ? ((active.won_amount / active.total_amount) * 100).toFixed(1) + '%'
    : '—';

  const kpis = [
    {label:'Total Quoted',   value:fmt(active.total_amount),   sub:`${active.total_quotes} quotes`,                            color:'#2563eb'},
    {label:'Won',            value:fmt(active.won_amount),     sub:`${active.won_count} deals`,                                color:'#16a34a'},
    {label:'Verbal',         value:fmt(active.verbal_amount),  sub:`${active.verbal_count} pending`,                           color:'#ca8a04'},
    {label:'Lost',           value:fmt(active.lost_amount||0), sub:`${active.lost_count||0} lost`,                             color:'#dc2626'},
    {label:'Closure Rate',   value:closureRate,                sub:`${active.won_count} won of ${active.total_quotes} quoted`, color:'#7c3aed'},
    {label:'$ Closure Rate', value:dollarClosureRate,          sub:`${fmt(active.won_amount)} of ${fmt(active.total_amount)}`, color:'#0891b2'},
  ];

  // Build a full 12-month rolling grid (past 6 + current + future 5) filled with data
  const today = new Date();
  const currentYM = today.toISOString().slice(0,7); // YYYY-MM
  const allMonths = Array.from({length:12}, (_,i) => {
    const d = new Date(today.getFullYear(), today.getMonth() - 6 + i, 1);
    const ym = d.toISOString().slice(0,7);
    const label = d.toLocaleDateString('en-US',{month:'short',year:'2-digit'});
    return {month:ym, name:label, won:0, verbal:0};
  });
  const projData = allMonths.map(m => ({
    ...m,
    total:  monthMap[m.month] ? (monthMap[m.month].total  || 0) : 0,
    won:    monthMap[m.month] ? (monthMap[m.month].won    || 0) : 0,
    verbal: monthMap[m.month] ? (monthMap[m.month].verbal || 0) : 0,
    isFuture: m.month > currentYM,
    isCurrent: m.month === currentYM,
  }));
  const totalWon    = projData.reduce((s,r) => s + r.won,    0);
  const totalVerbal = projData.reduce((s,r) => s + r.verbal, 0);
  const totalAll    = projData.reduce((s,r) => s + (r.total||0), 0);

  // ── Regional monthly chart data (RMAX only) ──
  const rmData         = hasRegions ? (by_region_month || []) : [];
  const REGION_ORDER_D = ['Central Texas','Southeast Texas','The Valley','(No Region)'];
  const allRegionsD    = hasRegions ? [...new Set(rmData.map(r => r.region))] : [];
  const allMonthsRM    = hasRegions ? [...new Set(rmData.map(r => r.month))].sort().reverse() : [];

  const regionTotal = {};
  allRegionsD.forEach(region => {
    const rows = rmData.filter(r => r.region === region);
    regionTotal[region] = rows.reduce((s, r) => s + r.count, 0);
  });
  const regionForMonth = {};
  if (selRegionMonth !== 'avg') {
    rmData.filter(r => r.month === selRegionMonth).forEach(r => { regionForMonth[r.region] = r.count; });
  }
  const rmChartData = hasRegions ? [
    ...REGION_ORDER_D.filter(r => allRegionsD.includes(r)),
    ...allRegionsD.filter(r => !REGION_ORDER_D.includes(r))
  ].map(region => ({
    region: region === '(No Region)' ? 'No Region' : region,
    count: selRegionMonth === 'avg' ? (regionTotal[region] || 0) : (regionForMonth[region] || 0)
  })) : [];

  // ── Location chart data (Hydrotech / Glassworks) ──
  const locationChartData = !hasRegions ? (by_location || []).map(r => ({
    name: r.location || '(No Location)',
    total: r.total || 0, won: r.won || 0, verbal: r.verbal || 0, count: r.count || 0,
  })) : [];

  // 12-Month Rolling Projected Sales chart data (by close_date)
  const closeMap = {};
  (by_close_month || []).forEach(r => { closeMap[r.month] = r; });
  const projSalesData = Array.from({length:12}, (_,i) => {
    const d = new Date(today.getFullYear(), today.getMonth() - 3 + i, 1);
    const ym = d.toISOString().slice(0,7);
    const label = d.toLocaleDateString('en-US',{month:'short',year:'2-digit'});
    const row = closeMap[ym] || {};
    return {
      month: ym, name: label,
      total:  row.total  || 0,
      won:    row.won    || 0,
      verbal: row.verbal || 0,
      open:   row.open   || 0,
      isFuture:  ym > currentYM,
      isCurrent: ym === currentYM,
    };
  });
  const projTotal  = projSalesData.reduce((s,r) => s + r.total,  0);
  const projWon    = projSalesData.reduce((s,r) => s + r.won,    0);
  const projVerbal = projSalesData.reduce((s,r) => s + r.verbal, 0);
  const projOpen   = projSalesData.reduce((s,r) => s + r.open,   0);

  // Pipeline chart data — region-based (RMAX) or location-based (others)
  const pipelineChartData = hasRegions ? (() => {
    const regionOrder = [
      ...REGION_ORDER_D.filter(r => (by_region||[]).some(x => x.region === r || (r === '(No Region)' && x.region === '(No Region)'))),
      ...(by_region||[]).map(x => x.region).filter(r => !REGION_ORDER_D.includes(r))
    ];
    if (selPipelineMonth === 'all') {
      return (by_region || []).map(r => ({
        region: r.region === '(No Region)' ? 'No Region' : r.region,
        total: r.total, won: r.won, verbal: r.verbal
      }));
    }
    const monthRows = rmData.filter(r => r.month === selPipelineMonth);
    const byReg = {};
    monthRows.forEach(r => { byReg[r.region] = r; });
    const allPipelineRegions = [...new Set([...regionOrder, ...monthRows.map(r => r.region)])];
    return allPipelineRegions.map(region => ({
      region: region === '(No Region)' ? 'No Region' : region,
      total:  (byReg[region] || {total:0}).total  || 0,
      won:    (byReg[region] || {won:0}).won      || 0,
      verbal: (byReg[region] || {verbal:0}).verbal || 0,
    })).filter(r => r.total > 0 || r.won > 0 || r.verbal > 0);
  })() : locationChartData.map(r => ({region: r.name, total: r.total, won: r.won, verbal: r.verbal}));

  return React.createElement('div', {className:'space-y-6'},
    // Dashboard title
    React.createElement('h2', {className:'text-xl font-bold text-gray-800'}, cfg.label + ' Dashboard'),
    // KPI row with month selector
    React.createElement('div', {className:'space-y-3'},
      React.createElement('div', {className:'flex items-center justify-between'},
        React.createElement('span', {className:'text-sm font-semibold text-gray-500 uppercase tracking-wide'},
          monthLabel
        ),
        React.createElement('select', {
          value: selMonth,
          onChange: e => setSelMonth(e.target.value),
          style:{fontSize:'13px', padding:'4px 8px', borderRadius:'7px', border:'1px solid #d1d5db',
                 background:'#fff', color:'#374151', cursor:'pointer', width:'140px'},

  const { quotesBase, exportUrl, dashboardBase } = cfg;
  const [quotes, setQuotes]             = useState([]);
  const [loading, setLoading]           = useState(true);
  const [filters, setFilters]           = useState({status:'All', search:''});
  const [regionFilter, setRegionFilter] = useState('All');
  const [deleting, setDeleting]         = useState(null);
  const [salesforceOnly, setSalesforceOnly] = useState(false);
  const [pdfUploading, setPdfUploading] = useState({});
  const [viewMode, setViewMode]         = useState('detail');
  const [sortCol, setSortCol]           = useState('date_received');
  const [sortAsc, setSortAsc]           = useState(false);
  const searchRef = useRef();
  const QUOTE_REGION_ORDER = cfg.regions || ['Central Texas','Southeast Texas','The Valley'];

  // silent=true → update quotes in place without showing spinner
  const load = useCallback(async (silent = false) => {
    if (!silent) setLoading(true);
    const params = new URLSearchParams();
    if (filters.status !== 'All') params.set('status', filters.status);
    if (filters.search)           params.set('search', filters.search);
    const data = await apiFetch(quotesBase + '?' + params);
    setQuotes(data);
    if (!silent) setLoading(false);
    // Scroll restore is handled by the caller (closeModal) — React itself doesn't reset scrollY
  }, [filters]);

  // Filter changes: full load with spinner
  useEffect(() => { load(false); }, [load]);
  // Parent refresh (modal save / sync button): silent in-place update
  const prevRefresh = useRef(refresh);
  useEffect(() => {
    if (prevRefresh.current === refresh) return;
    prevRefresh.current = refresh;
    load(true);
  // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [refresh]);

  async function doDelete(id) {
    await apiFetch(`${quotesBase}/${id}`, {method:'DELETE'});
    setDeleting(null);
    load();
  }

  const setFilter = (k,v) => setFilters(f => ({...f,[k]:v}));

  return React.createElement('div', {className:'space-y-4'},

// ── Texas Region Map ─────────────────────────────────────────────────────────
// Coordinates derived from real Texas border lat/lon data.
// Transform: x=(106.65-lon)/13.14*100, y=(36.50-lat)/10.66*100  (viewBox 0 0 100 100)
//
// Key border points used (clockwise from NW panhandle):
//   NW panhandle (103°W,36.5°N)→NE panhandle (100°W,36.5°N)→SE panhandle (100°W,34°N)
//   →Red River/NE TX (94°W,33.5°N)→Sabine Pass (94°W,29.7°N)→Gulf Coast arc
//   →Brownsville (97.2°W,25.9°N)→Rio Grande west: Rio Grande City→Laredo→Eagle Pass
//   →Del Rio→Big Bend (102°W,29°N)→Presidio (104.4°W,29.6°N)→El Paso (106.5°W,31.8°N)
//   →step east to NM border (103°W,31.8°N)→Z closes N along NM border to panhandle
function TexasMap({region, size}) {
  const sz = size || 52;
  const uid = 'txc' + (region||'x').replace(/\s/g,'') + sz;
  const outline = [
    "M27,0",               // NW panhandle corner
    "L51,0",               // NE panhandle corner
    "L51,23",              // SE panhandle (meets Red River at 100°W)
    "L96,28",              // NE Texas / Texarkana area
    "L97,64",              // E Texas / Sabine River south
    "L91,66",              // Sabine Pass transition
    "L90,68",              // Galveston area
    "L86,70",              // Freeport/Brazoria
    "L82,72",              // Matagorda Bay
    "L77,74",              // Port Lavaca
    "L73,80",              // Aransas Pass / Rockport
    "L70,81",              // Corpus Christi
    "L71,84",              // Padre Island north
    "L72,97",              // Port Isabel
    "L72,99",              // Brownsville / Rio Grande mouth
    "L60,95",              // Rio Grande City
    "L54,85",              // Laredo
    "L47,73",              // Eagle Pass
    "L44,67",              // Del Rio
    "L35,70",              // Big Bend (dips south into Mexico)
    "L17,65",              // Presidio
    "L1,44",               // El Paso
    "L27,44",              // Step east to NM/TX border at 103°W
    "Z"                    // Closes north along NM border back to NW panhandle
  ].join(" ");

  // Region highlight polygons — clipped to Texas outline
  const hl = {
    // Central TX: Waco / Austin / San Antonio corridor
    'Central Texas':   {d:"M42,38 L83,38 L83,88 L52,96 L38,82 L36,67 L33,57 Z",  fill:"#3b82f6"},
    // SE TX: Houston / Beaumont / Port Arthur / Galveston
    'Southeast Texas': {d:"M76,45 L100,45 L100,80 L84,85 L74,80 L74,58 Z",        fill:"#f97316"},
    // The Valley: Rio Grande Valley — Laredo / McAllen / Brownsville strip
    'The Valley':      {d:"M47,82 L75,82 L75,100 L47,100 Z",                       fill:"#16a34a"},
  };
  const h = hl[region];
  return React.createElement('svg', {
    viewBox:"0 0 100 100", width:sz, height:sz,
    style:{flexShrink:0, filter:'drop-shadow(0 1px 3px rgba(0,0,0,0.4))'}
  },
    React.createElement('defs', {},
      React.createElement('clipPath', {id:uid},
        React.createElement('path', {d:outline})
      )
    ),
    // Base state fill
    React.createElement('path', {d:outline, fill:'#b6c5db', stroke:'#fff', strokeWidth:1.5}),
    // Region highlight (clipped to state shape)
    h && React.createElement('path', {
      d:h.d, fill:h.fill, fillOpacity:0.82,
      clipPath:`url(#${uid})`
    }),
    // Outline on top for crisp edge
    React.createElement('path', {d:outline, fill:'none', stroke:'#fff', strokeWidth:1.5})
  );
}

// ── Customer Directory ────────────────────────────────────────────────────────
function CustomerDirectory() {
  const [contacts,    setContacts]    = useState([]);
  const [loading,     setLoading]     = useState(true);
  const [filter,      setFilter]      = useState('All');
  const [search,      setSearch]      = useState('');
  const [importing,   setImporting]   = useState(false);
  const [importMsg,   setImportMsg]   = useState('');
  const [scanning,    setScanning]    = useState(false);
  const [editingId,   setEditingId]   = useState(null);
  const [editForm,    setEditForm]    = useState({});
  const [sigFetching, setSigFetching] = useState(null);
  const [adding,      setAdding]      = useState(false);
  const [newForm,     setNewForm]     = useState({name:'',company:'',phone:'',email:'',location:'',product_line:'RMAX',customer_type:'',region:'',notes:''});
  const [regionFilter, setRegionFilter] = useState('All');
  const [companies,    setCompanies]   = useState([]);
  const [editLinkedCo, setEditLinkedCo] = useState(null);
  const [editCoSearch, setEditCoSearch] = useState('');
  const [newLinkedCo,  setNewLinkedCo]  = useState(null);
  const [newCoSearch,  setNewCoSearch]  = useState('');
  const CUSTOMER_TYPES = ['','Contractor','Distributor','General Contractor','Architect'];
  const REGIONS = ['','Central Texas','Southeast Texas','The Valley'];

  useEffect(() => {
    apiFetch('/api/companies').then(data => setCompanies(data || [])).catch(() => {});
  }, []);

  function loadContacts(f, s) {
    setLoading(true);
    const pf = f !== undefined ? f : filter;
    const ps = s !== undefined ? s : search;
    let url = '/api/contacts?a=1';
    if (pf && pf !== 'All') url += `&product_line=${encodeURIComponent(pf)}`;
    if (ps) url += `&search=${encodeURIComponent(ps)}`;
    apiFetch(url).then(data => { setContacts(data); setLoading(false); }).catch(() => setLoading(false));
  }

  useEffect(() => { loadContacts(); }, [filter, search]);

  // Auto-import contacts from quotes silently on every tab open
  useEffect(() => {
    apiFetch('/api/contacts/import-from-quotes', {method:'POST'})
      .then(() => loadContacts())
      .catch(() => {});
  }, []);

  function handleImport() {
    setImporting(true);
    apiFetch('/api/contacts/import-from-quotes', {method:'POST'})
      .then(data => {
        setImportMsg(`✓ ${data.inserted} new, ${data.updated||0} updated, ${data.skipped} unchanged`);
        loadContacts();
      })
      .catch(() => setImportMsg('❌ Import failed'))
      .finally(() => { setImporting(false); setTimeout(() => setImportMsg(''), 6000); });
  }

  function handleScan() {
    setScanning(true);
    apiFetch('/api/contacts/scan-outlook-folders', {method:'POST'})
      .then(data => {
        if (data.error) { setImportMsg('❌ ' + data.error); return; }
        const parts = (data.folders||[]).map(f =>
          f.error ? `${f.folder}: ${f.error}`
                  : `${f.folder}: ${f.messages_scanned} emails → ${f.created} new, ${f.updated} updated`
        );
        setImportMsg(`✓ Scan complete — ${parts.join(' | ')} (${data.total_created} total new contacts)`);
        loadContacts();
      })
      .catch(() => setImportMsg('❌ Scan failed'))
      .finally(() => { setScanning(false); setTimeout(() => setImportMsg(''), 10000); });
  }

  function startEdit(c) {
    setEditingId(c.id);
    setEditForm({...c});
    const linked = c.linked_company_id
      ? (companies.find(co => co.id === c.linked_company_id) || {id:c.linked_company_id, name:c.linked_company_name||'Unknown'})
      : null;
    setEditLinkedCo(linked);
    setEditCoSearch('');
  }
  function cancelEdit() {
    setEditingId(null);
    setEditForm({});
    setEditLinkedCo(null);
    setEditCoSearch('');
  }
  function saveEdit() {
    const contactId = editingId;
    const prevLinkedId = editForm.linked_company_id || null;
    apiFetch(`/api/contacts/${contactId}`, {method:'PUT', body:JSON.stringify(editForm)})
      .then(() => {
        const tasks = [];
        if (editLinkedCo && editLinkedCo.id !== prevLinkedId) {
          if (prevLinkedId) tasks.push(apiFetch(`/api/companies/${prevLinkedId}/contacts/${contactId}`, {method:'DELETE'}).catch(()=>{}));
          tasks.push(apiFetch(`/api/companies/${editLinkedCo.id}/contacts`, {
            method:'POST', headers:{'Content-Type':'application/json'},
            body:JSON.stringify({contact_id:contactId, role:''})
          }).catch(()=>{}));
        } else if (!editLinkedCo && prevLinkedId) {
          tasks.push(apiFetch(`/api/companies/${prevLinkedId}/contacts/${contactId}`, {method:'DELETE'}).catch(()=>{}));
        }
        return Promise.all(tasks);
      })
      .then(() => { cancelEdit(); loadContacts(); });
  }
  function deleteContact(id) {
    if (!confirm('Delete this contact?')) return;
    apiFetch(`/api/contacts/${id}`, {method:'DELETE'}).then(() => loadContacts());
  }
  function fetchSig(email, id) {
    setSigFetching(email);
    apiFetch(`/api/contacts/fetch-signature/${encodeURIComponent(email)}`)
      .then(data => {
        if (data.found) {
          const c = contacts.find(x => x.id === id) || {};
          startEdit({...c, id,
            name:  data.name  || c.name  || '',
            phone: data.phone || c.phone || '',
            notes: c.notes || (data.signature_text ? data.signature_text.slice(0,300) : ''),
          });
        } else {
          alert('No signature found: ' + (data.reason || 'unknown'));
        }
      })
      .catch(() => alert('Error fetching signature'))
      .finally(() => setSigFetching(null));
  }
  function saveNew() {
    apiFetch('/api/contacts', {method:'POST', body:JSON.stringify(newForm)})
      .then(data => {
        const linkTask = newLinkedCo && data.id
          ? apiFetch(`/api/companies/${newLinkedCo.id}/contacts`, {
              method:'POST', headers:{'Content-Type':'application/json'},
              body:JSON.stringify({contact_id:data.id, role:''})
            }).catch(()=>{})
          : Promise.resolve();
        return linkTask;
      })
      .then(() => {
        setAdding(false);
        setNewForm({name:'',company:'',phone:'',email:'',location:'',product_line:'RMAX',customer_type:'',notes:''});
        setNewLinkedCo(null);
        setNewCoSearch('');
        loadContacts();
      })
      .catch(() => alert('Could not save — check that the email address is unique'));
  }

  const plBg   = pl => pl==='RMAX'?'#dbeafe' : pl==='Hydrotech'?'#dcfce7' : '#ede9fe';
  const plText = pl => pl==='RMAX'?'#1e40af' : pl==='Hydrotech'?'#15803d' : '#6d28d9';
  const typeColor = t => t==='Contractor'?'#1d4ed8':t==='Distributor'?'#16a34a':t==='General Contractor'?'#7c3aed':t==='Architect'?'#b45309':'#6b7280';
  const typeBg    = t => t==='Contractor'?'#dbeafe':t==='Distributor'?'#dcfce7':t==='General Contractor'?'#ede9fe':t==='Architect'?'#fef3c7':'#f3f4f6';
  const TYPE_ORDER = ['Contractor','General Contractor','Distributor','Architect','Unclassified'];
  const TYPE_ABBR  = {'Contractor':'CTR','Distributor':'DIST','General Contractor':'GC','Architect':'ARCH'};

  // Region tabs — fixed order
  const REGION_ORDER = ['Central Texas','Southeast Texas','The Valley'];
  const allRegionTabs = ['All', ...REGION_ORDER, '(No Region)'];

  // Apply region filter
  const regionFiltered = regionFilter==='All' ? contacts
    : contacts.filter(c => ((c.region||'').trim()||'(No Region)') === regionFilter);

  // Group: region → type → sorted contacts
  const groupMap = {};
  [...regionFiltered].sort((a,b)=>(a.company||'').toLowerCase().localeCompare((b.company||'').toLowerCase()))
    .forEach(c => {
      const region = (c.region||'').trim() || '(No Region)';
      const type   = c.customer_type || 'Unclassified';
      if (!groupMap[region]) groupMap[region] = {};
      if (!groupMap[region][type]) groupMap[region][type] = [];
      groupMap[region][type].push(c);
    });
  const displayGroups = [...REGION_ORDER, '(No Region)']
    .filter(r => groupMap[r])
    .map(region => ({region, byType: groupMap[region]}));

  // Stats
  const typeCount = {};
  contacts.forEach(c => { const t = c.customer_type||'Unclassified'; typeCount[t]=(typeCount[t]||0)+1; });

  // Avatar initials
  function getInitials(c) {
    const src = (c.name || c.company || '?').trim();
    const parts = src.split(/\s+/);
    return parts.length >= 2
      ? (parts[0][0] + parts[parts.length-1][0]).toUpperCase()
      : src.slice(0,2).toUpperCase();
  }

  // Render a single contact card
  function renderCard(c) {
    const initials = getInitials(c);
    const avBg     = typeColor(c.customer_type||'Unclassified');
    const typeAbbr = TYPE_ABBR[c.customer_type] || '';
    return React.createElement('div', {
      key:c.id,
      className:'bg-white rounded-2xl border shadow-sm hover:shadow-lg transition-all duration-200 flex flex-col overflow-hidden'
    },
      // Card header gradient
      React.createElement('div', {
        className:'flex flex-col items-center pt-5 pb-4 px-4 relative',
        style:{background:'linear-gradient(160deg,#f8fafc 0%,#e8f0fe 100%)'}
      },
        // Product badge — top-left
        React.createElement('div', {className:'absolute top-3 left-3'},
          React.createElement('span', {
            className:'text-xs font-bold px-2 py-0.5 rounded-full',
            style:{background:plBg(c.product_line), color:plText(c.product_line)}
          }, c.product_line||'—')
        ),
        // Lock — top-right
        c.manually_edited && React.createElement('div', {className:'absolute top-3 right-3'},
          React.createElement('span',{title:'Manually edited — protected from auto-import overwrites',className:'text-sm'},'🔒')
        ),
        // Avatar circle
        React.createElement('div', {
          className:'w-16 h-16 rounded-full flex items-center justify-center text-xl font-extrabold mb-2 relative select-none',
          style:{background:avBg, color:'#fff', boxShadow:'0 2px 10px rgba(0,0,0,0.18)'}
        },
          initials,
          typeAbbr && React.createElement('div', {
            className:'absolute font-bold rounded-full flex items-center justify-center text-white',
            style:{background:avBg, fontSize:'8px', minWidth:'22px', height:'16px', border:'2px solid white', padding:'0 3px', bottom:'-4px', right:'-4px'}
          }, typeAbbr)
        ),
        // Name
        React.createElement('div', {
          className:'font-bold text-gray-900 text-sm text-center leading-tight mt-1 w-full truncate',
          title:c.name||''
        }, c.name || React.createElement('span',{className:'text-gray-400 italic text-xs'},'No name yet')),
        // Company
        c.company && React.createElement('div', {
          className:'text-xs text-gray-500 text-center mt-0.5 w-full truncate font-medium',
          title:c.company
        }, c.company),
        c.linked_company_name && React.createElement('div', {
          className:'text-xs font-semibold mt-1 px-2 py-0.5 rounded-full truncate',
          style:{background:'#dbeafe',color:'#1e40af',maxWidth:'100%'},
          title:'Linked account: '+c.linked_company_name
        }, '🏢 ' + c.linked_company_name)
      ),
      // Contact info rows
      React.createElement('div', {className:'px-4 py-3 flex-1 space-y-2'},
        c.phone
          ? React.createElement('div', {className:'flex items-center gap-2 text-xs'},
              React.createElement('span',{className:'text-gray-400 flex-shrink-0'},'📞'),
              React.createElement('a',{href:`tel:${c.phone}`,className:'text-gray-700 hover:text-blue-600'},c.phone)
            )
          : null,
        c.email
          ? React.createElement('div', {className:'flex items-center gap-2 text-xs'},
              React.createElement('span',{className:'text-gray-400 flex-shrink-0'},'✉'),
              React.createElement('a',{href:`mailto:${c.email}`,className:'text-blue-600 hover:underline truncate block',title:c.email},c.email)
            )
          : null,
        !c.phone && !c.email && React.createElement('div',{className:'text-xs text-gray-300 italic'},'No contact info yet')
      ),
      // Action bar
      React.createElement('div', {className:'flex items-center justify-end gap-1 px-3 py-2 border-t bg-gray-50'},
        React.createElement('button',{
          title:'Fetch from email signature', onClick:()=>c.email&&fetchSig(c.email,c.id),
          disabled:sigFetching===c.email||!c.email,
          className:'text-gray-400 hover:text-blue-600 px-2 py-1 rounded-md text-xs border border-transparent hover:border-blue-200 hover:bg-blue-50 transition-colors'
        }, sigFetching===c.email?'⏳':'✉'),
        React.createElement('button',{
          title:'Edit', onClick:()=>startEdit(c),
          className:'text-gray-400 hover:text-blue-600 px-2 py-1 rounded-md text-xs border border-transparent hover:border-blue-200 hover:bg-blue-50 transition-colors'
        },'✏️'),
        React.createElement('button',{
          title:'Delete', onClick:()=>deleteContact(c.id),
          className:'text-gray-400 hover:text-red-500 px-2 py-1 rounded-md text-xs border border-transparent hover:border-red-200 hover:bg-red-50 transition-colors'
        },'🗑')
      )
    );
  }

  // Shared form field renderer
  function formField(label, key, form, setForm, type) {
    const cls = 'w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-300';
    return React.createElement('div', {key: label+key},
      React.createElement('label', {className:'block text-xs font-medium text-gray-500 mb-1'}, label),
      type==='select'

            ['RMAX','Hydrotech','Both'].map(v=>React.createElement('option',{key:v,value:v},v))
          )
        : type==='ctype'
        ? React.createElement('select', {value:form[key]||'', onChange:e=>setForm(f=>({...f,[key]:e.target.value})), className:cls},

        ? React.createElement('select', {value:form[key]||'', onChange:e=>setForm(f=>({...f,[key]:e.target.value})), className:cls},

        ? React.createElement('textarea', {value:form[key]||'', onChange:e=>setForm(f=>({...f,[key]:e.target.value})), rows:3, className:cls+' resize-none'})
        : React.createElement('input', {type:'text', value:form[key]||'', onChange:e=>setForm(f=>({...f,[key]:e.target.value})), className:cls})

  // Searchable company-link field
  function renderCompanyLinkField(linkedCo, setLinkedCo, coSearch, setCoSearch) {
    const filtered = coSearch
      ? companies.filter(c => c.name.toLowerCase().includes(coSearch.toLowerCase())).slice(0,8)
      : [];
    return React.createElement('div', {className:'sm:col-span-2'},
      React.createElement('label', {className:'block text-xs font-medium text-gray-500 mb-1'}, 'Linked Account'),
      React.createElement('div', {style:{position:'relative'}},

    : contacts.length === 0

          React.createElement('p', {className:'text-sm text-gray-400'}, 'Click "⬇ Import from Quotes" or "+ Add Contact" to get started.')

    : React.createElement('div', {className:'space-y-5'},

        // ── Region tabs ──
        React.createElement('div', {

        // ── Card groups ──
        ...displayGroups.flatMap(({region, byType}) => {

                  React.createElement('div', {
                    className:'text-xs font-medium mt-0.5',

                )
              )
            );

          typeKeys.forEach(type => {

                ),

                },
                  ...byType[type].map(c => renderCard(c))

    // ── Edit modal ──
    editingId && renderModal(
      'Edit Contact',
      editForm, setEditForm,
      saveEdit, cancelEdit,
      editForm.email && React.createElement('button', {
        onClick: () => fetchSig(editForm.email, editingId),
        disabled: sigFetching === editForm.email,
        className:'text-sm text-blue-600 hover:text-blue-800 disabled:opacity-40'
      }, sigFetching === editForm.email ? '⏳ Fetching…' : '✉ Fetch from email sig'),
      [renderCompanyLinkField(editLinkedCo, setEditLinkedCo, editCoSearch, setEditCoSearch)]
    ),

    // ── Add contact modal ──
    adding && renderModal(
      'New Contact',
      newForm, setNewForm,
      saveNew, () => { setAdding(false); setNewLinkedCo(null); setNewCoSearch(''); },
      null,
      [renderCompanyLinkField(newLinkedCo, setNewLinkedCo, newCoSearch, setNewCoSearch)]

}

// ── Company Accounts ──────────────────────────────────────────────────────────
function CompanyAccounts() {
  const [companies,     setCompanies]     = useState([]);
  const [loading,       setLoading]       = useState(true);
  const [search,        setSearch]        = useState('');
  const [selected,      setSelected]      = useState(null);   // company object
  const [editForm,      setEditForm]      = useState(null);   // null = view, obj = editing
  const [adding,        setAdding]        = useState(false);
  const [newForm,       setNewForm]       = useState({name:'',address:'',phone:'',website:'',region:'',notes:'',strong_market_partner:0,large_account_opportunity:0});
  const COMPANY_REGIONS = ['','Central Texas','Southeast Texas','The Valley'];
  const [linked,        setLinked]        = useState([]);     // contacts for selected company
  const [linkSearch,    setLinkSearch]    = useState('');
  const [allContacts,   setAllContacts]   = useState([]);
  const [pickerOpen,          setPickerOpen]          = useState(false);
  const [pickerSearch,        setPickerSearch]        = useState('');
  const [quoteStats,          setQuoteStats]          = useState(null);
  const [statsPeriod,         setStatsPeriod]         = useState('all');
  const [quotesModalOpen,     setQuotesModalOpen]     = useState(false);
  const [quotesModalData,     setQuotesModalData]     = useState([]);
  const [quotesModalLoading,  setQuotesModalLoading]  = useState(false);
  const [createContactOpen,   setCreateContactOpen]   = useState(false);
  const [createContactForm,   setCreateContactForm]   = useState({name:'',email:'',phone:'',role:''});
  const [createContactSaving, setCreateContactSaving] = useState(false);
  const [saving,        setSaving]        = useState(false);
  const [msg,           setMsg]           = useState('');
  const [regionFilter,  setRegionFilter]  = useState('All');

  function loadCompanies(s, r) {
    setLoading(true);
    const q  = s !== undefined ? s : search;
    const rf = r !== undefined ? r : regionFilter;
    const params = [];
    if (q)            params.push(`search=${encodeURIComponent(q)}`);
    if (rf && rf !== 'All') params.push(`region=${encodeURIComponent(rf)}`);
    const url = '/api/companies' + (params.length ? '?' + params.join('&') : '');
    apiFetch(url)
      .then(data => { setCompanies(data); setLoading(false); })
      .catch(() => setLoading(false));
  }

  function loadStats(companyId, period) {
    apiFetch(`/api/companies/${companyId}/quote-stats?period=${encodeURIComponent(period)}`)
      .then(setQuoteStats).catch(() => {});
  }

  function loadLinked(companyId, period) {
    const p = period || statsPeriod;
    Promise.all([
      apiFetch(`/api/companies/${companyId}/contacts`),
      apiFetch(`/api/companies/${companyId}/quote-stats?period=${encodeURIComponent(p)}`),
    ]).then(([contacts, stats]) => {
      setLinked(contacts);
      setQuoteStats(stats);
    }).catch(() => {});
  }

  function loadAllContacts() {
    apiFetch('/api/contacts').then(setAllContacts).catch(() => {});
  }

  useEffect(() => { loadCompanies(); loadAllContacts(); }, []);

  function selectCompany(co) {
    setSelected(co);
    setEditForm(null);
    setLinkSearch('');
    if (co) loadLinked(co.id);
    else { setLinked([]); setQuoteStats(null); }
  }

  function flash(m) { setMsg(m); setTimeout(() => setMsg(''), 4000); }

  // ── Save new company ──
  function saveNew() {
    if (!newForm.name.trim()) return;
    setSaving(true);
    apiFetch('/api/companies', { method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify(newForm) })
      .then(data => {
        const created = { ...newForm, id: data.id, contact_count: 0 };
        setCompanies(prev => [...prev, created].sort((a,b) => a.name.localeCompare(b.name)));
        setAdding(false);
        setNewForm({name:'',address:'',phone:'',website:'',region:'',notes:'',strong_market_partner:0,large_account_opportunity:0});
        selectCompany(created);
        flash('✓ Company created');
      })
      .catch(() => flash('❌ Save failed'))
      .finally(() => setSaving(false));
  }

  // ── Save edit ──
  function saveEdit() {
    if (!editForm.name.trim()) return;
    setSaving(true);
    apiFetch(`/api/companies/${selected.id}`, { method:'PUT', headers:{'Content-Type':'application/json'},
      body: JSON.stringify(editForm) })
      .then(() => {
        const updated = { ...selected, ...editForm };
        setSelected(updated);
        setCompanies(prev => prev.map(c => c.id === selected.id ? updated : c));
        setEditForm(null);
        flash('✓ Saved');
      })
      .catch(() => flash('❌ Save failed'))
      .finally(() => setSaving(false));
  }

  // ── Delete company ──
  function deleteCompany(co) {
    if (!confirm(`Delete "${co.name}"? This will also remove all linked contacts.`)) return;
    apiFetch(`/api/companies/${co.id}`, { method:'DELETE' })
      .then(() => {
        setCompanies(prev => prev.filter(c => c.id !== co.id));
        if (selected && selected.id === co.id) { setSelected(null); setLinked([]); }
        flash('✓ Company deleted');
      })
      .catch(() => flash('❌ Delete failed'));
  }

  // ── Link contact ──
  function linkContact(contact) {
    apiFetch(`/api/companies/${selected.id}/contacts`, { method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ contact_id: contact.id, role: '' }) })
      .then(() => {
        loadLinked(selected.id);
        setCompanies(prev => prev.map(c => c.id === selected.id
          ? {...c, contact_count: (c.contact_count||0)+1} : c));
        setPickerOpen(false);
        setPickerSearch('');
      })
      .catch(e => flash('❌ Already linked or error'));
  }

  // ── Create contact & auto-link ──
  function createAndLinkContact() {
    if (!createContactForm.name.trim()) return;
    setCreateContactSaving(true);
    apiFetch('/api/contacts', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({
        name:    createContactForm.name,
        email:   createContactForm.email,
        phone:   createContactForm.phone,
        company: selected.name,
      })
    })
    .then(newContact =>
      apiFetch(`/api/companies/${selected.id}/contacts`, {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ contact_id: newContact.id, role: createContactForm.role })
      })
    )
    .then(() => Promise.all([
      apiFetch(`/api/companies/${selected.id}/contacts`),
      apiFetch('/api/contacts')
    ]))
    .then(([linkedData, allData]) => {
      setLinked(linkedData);
      setAllContacts(allData);
      setCreateContactOpen(false);
      setCreateContactForm({name:'', email:'', phone:'', role:''});
      setCreateContactSaving(false);
    })
    .catch(() => setCreateContactSaving(false));
  }

  // ── Unlink contact ──
  function unlinkContact(contact) {
    apiFetch(`/api/companies/${selected.id}/contacts/${contact.id}`, { method:'DELETE' })
      .then(() => {
        setLinked(prev => prev.filter(c => c.id !== contact.id));
        setCompanies(prev => prev.map(c => c.id === selected.id
          ? {...c, contact_count: Math.max(0,(c.contact_count||1)-1)} : c));
      })
      .catch(() => flash('❌ Remove failed'));
  }

  // ── Update role inline ──
  function updateRole(contact, role) {
    apiFetch(`/api/companies/${selected.id}/contacts/${contact.id}`, { method:'PUT',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ contact_id: contact.id, role }) })
      .then(() => setLinked(prev => prev.map(c => c.id === contact.id ? {...c, role} : c)))
      .catch(() => {});
  }

  // Contacts not yet linked to this company
  const linkedIds = new Set(linked.map(c => c.id));
  const availableContacts = allContacts.filter(c =>
    !linkedIds.has(c.id) &&
    (!pickerSearch || (c.name||'').toLowerCase().includes(pickerSearch.toLowerCase())
      || (c.company||'').toLowerCase().includes(pickerSearch.toLowerCase())
      || (c.email||'').toLowerCase().includes(pickerSearch.toLowerCase()))
  );

  const filteredLinked = linked.filter(c =>
    !linkSearch ||
    (c.name||'').toLowerCase().includes(linkSearch.toLowerCase()) ||
    (c.email||'').toLowerCase().includes(linkSearch.toLowerCase())
  );

  // Shared input style
  const inp = {
    width:'100%', padding:'6px 10px', border:'1px solid #d1d5db',
    borderRadius:'6px', fontSize:'13px', boxSizing:'border-box'
  };

  function fieldRow(label, key, form, setForm, type='text') {
    return React.createElement('div', {key, style:{marginBottom:'10px'}},
      React.createElement('label', {style:{display:'block', fontSize:'11px', fontWeight:600, color:'#6b7280', marginBottom:'3px', textTransform:'uppercase', letterSpacing:'0.5px'}}, label),
      type === 'textarea'
        ? React.createElement('textarea', {
            value: form[key]||'', rows:3,
            onChange: e => setForm(f=>({...f,[key]:e.target.value})),
            style:{...inp, resize:'vertical'}
          })
        : React.createElement('input', {
            type, value: form[key]||'',
            onChange: e => setForm(f=>({...f,[key]:e.target.value})),
            style: inp
          })
    );
  }

  function selectRow(label, key, form, setForm, options) {
    return React.createElement('div', {key, style:{marginBottom:'10px'}},
      React.createElement('label', {style:{display:'block', fontSize:'11px', fontWeight:600, color:'#6b7280', marginBottom:'3px', textTransform:'uppercase', letterSpacing:'0.5px'}}, label),
      React.createElement('select', {
        value: form[key]||'',
        onChange: e => setForm(f=>({...f,[key]:e.target.value})),
        style:{...inp, background:'#fff'}
      }, options.map(o => React.createElement('option', {key:o, value:o}, o||'— None —')))
    );
  }

  function checkboxRow(label, key, form, setForm, color='#1F4E79') {
    const checked = !!(form[key]);
    return React.createElement('label', {key, style:{display:'flex', alignItems:'center', gap:'10px', cursor:'pointer', padding:'7px 10px', borderRadius:'8px', border:`1px solid ${checked ? color : '#e2e8f0'}`, background: checked ? `${color}12` : '#fafafa', marginBottom:'8px', userSelect:'none'}},
      React.createElement('input', {
        type:'checkbox', checked,
        onChange: e => setForm(f=>({...f,[key]: e.target.checked ? 1 : 0})),
        style:{width:'16px', height:'16px', accentColor: color, cursor:'pointer', flexShrink:0}
      }),
      React.createElement('span', {style:{fontSize:'13px', fontWeight: checked ? 700 : 500, color: checked ? color : '#64748b'}}, label)
    );
  }

  return React.createElement('div', {style:{display:'flex', gap:'0', minHeight:'70vh', background:'#f8fafc', borderRadius:'12px', overflow:'hidden', border:'1px solid #e2e8f0', boxShadow:'0 1px 4px rgba(0,0,0,0.07)'}},

    // ── LEFT: Company list ────────────────────────────────────────────────────
    React.createElement('div', {style:{width:'680px', flexShrink:0, borderRight:'1px solid #e2e8f0', background:'#fff', display:'flex', flexDirection:'column', height:'75vh', position:'sticky', top:0}},

      // Header
      React.createElement('div', {style:{padding:'14px 14px 10px', borderBottom:'1px solid #f0f4f8'}},
        React.createElement('div', {style:{display:'flex', alignItems:'center', justifyContent:'space-between', marginBottom:'8px'}},
          React.createElement('h2', {style:{fontSize:'15px', fontWeight:700, color:'#1F4E79', margin:0}}, '🏢 Companies'),
          React.createElement('div', {style:{display:'flex', gap:'5px'}},
            React.createElement('a', {
              href: '/api/companies/export',
              download: 'company_accounts.xlsx',
              title: 'Export all companies + contacts to Excel',

// ── Login form (shown on splash when not authenticated) ───────────────────────
function LoginForm({ onLogin }) {
  const [email,    setEmail]    = useState('');
  const [password, setPassword] = useState('');
  const [error,    setError]    = useState('');
  const [loading,  setLoading]  = useState(false);

  async function handleSubmit(e) {
    e.preventDefault();
    setLoading(true);
    setError('');
    try {
      const res = await fetch('/api/auth/login', {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ email: email.trim(), password })
      });
      const data = await res.json();
      if (!res.ok) { setError(data.detail || 'Login failed'); setLoading(false); return; }
      localStorage.setItem('auth_token', data.token);
      onLogin(data);
    } catch(err) {
      setError('Could not connect to server');
      setLoading(false);
    }
  }

  const inputStyle = {
    width:'100%', padding:'10px 12px', borderRadius:'8px', boxSizing:'border-box',
    border:'1px solid rgba(255,255,255,0.25)', background:'rgba(255,255,255,0.12)',
    color:'#fff', fontSize:'14px', outline:'none'
  };
  const labelStyle = { display:'block', color:'#bfdbfe', fontSize:'11px', fontWeight:700,
    letterSpacing:'0.06em', textTransform:'uppercase', marginBottom:'6px' };

  return React.createElement('form', {
    onSubmit: handleSubmit,
    style: {
      background:'rgba(255,255,255,0.1)', backdropFilter:'blur(12px)',
      borderRadius:'16px', padding:'28px 32px', width:'min(90vw,360px)',
      border:'1px solid rgba(255,255,255,0.18)', marginTop:'8px'
    }
  },
    React.createElement('div', {style:{marginBottom:'14px'}},
      React.createElement('label', {style:labelStyle}, 'Email'),
      React.createElement('input', {type:'email', value:email, onChange:e=>setEmail(e.target.value),
        placeholder:'name@specformbc.com', required:true, disabled:loading, style:inputStyle})
    ),
    React.createElement('div', {style:{marginBottom:'20px'}},
      React.createElement('label', {style:labelStyle}, 'Password'),
      React.createElement('input', {type:'password', value:password, onChange:e=>setPassword(e.target.value),
        placeholder:'••••••••', required:true, disabled:loading, style:inputStyle})
    ),
    error && React.createElement('div', {style:{
      background:'rgba(239,68,68,0.2)', border:'1px solid rgba(239,68,68,0.35)',
      color:'#fca5a5', borderRadius:'8px', padding:'9px 12px',
      fontSize:'13px', marginBottom:'16px', textAlign:'center'
    }}, error),
    React.createElement('button', {
      type:'submit', disabled:loading,
      style:{
        width:'100%', padding:'11px', borderRadius:'8px', border:'none',
        background: loading ? 'rgba(255,255,255,0.2)' : '#fff',
        color: loading ? '#9ca3af' : '#1F4E79',
        fontWeight:700, fontSize:'14px', cursor: loading ? 'default' : 'pointer',
        transition:'all 0.2s'
      }
    }, loading ? 'Signing in…' : 'Sign In')
  );
}

// ── Change Password Modal ─────────────────────────────────────────────────────
function ChangePasswordModal({ onClose }) {
  const [current, setCurrent]   = useState('');
  const [next,    setNext]      = useState('');
  const [confirm, setConfirm]   = useState('');
  const [err,     setErr]       = useState('');
  const [ok,      setOk]        = useState(false);
  const [busy,    setBusy]      = useState(false);

  function submit(e) {
    e.preventDefault();
    setErr('');
    if (next.length < 8)           { setErr('New password must be at least 8 characters.'); return; }
    if (next !== confirm)          { setErr('New passwords do not match.'); return; }
    setBusy(true);
    apiFetch('/api/auth/change-password', {
      method: 'POST',
      body: JSON.stringify({ current_password: current, new_password: next })
    })
      .then(() => setOk(true))
      .catch(e => setErr(e.message || 'Failed to change password.'))
      .finally(() => setBusy(false));
  }

  const overlay = { position:'fixed', inset:0, background:'rgba(0,0,0,0.5)', zIndex:1000,
    display:'flex', alignItems:'center', justifyContent:'center' };
  const box = { background:'#fff', borderRadius:'12px', padding:'28px 32px',
    width:'100%', maxWidth:'400px', boxShadow:'0 8px 32px rgba(0,0,0,0.18)' };
  const inp = { width:'100%', padding:'8px 10px', border:'1px solid #d1d5db',
    borderRadius:'6px', fontSize:'14px', boxSizing:'border-box', marginTop:'4px' };
  const btn = (primary) => ({
    padding:'9px 20px', borderRadius:'7px', fontWeight:700, fontSize:'14px', cursor:'pointer',
    border:'none', background: primary ? '#1F4E79' : '#e5e7eb', color: primary ? '#fff' : '#374151'
  });

  return React.createElement('div', { style: overlay, onClick: e => e.target === e.currentTarget && onClose() },
    React.createElement('div', { style: box },
      React.createElement('h3', { style:{margin:'0 0 20px', fontSize:'18px', fontWeight:700, color:'#1F4E79'} },
        '🔑 Change Password'),
      ok
        ? React.createElement('div', null,
            React.createElement('p', { style:{color:'#16a34a', fontWeight:600, marginBottom:'16px'} },
              '✓ Password updated successfully.'),
            React.createElement('button', { style: btn(true), onClick: onClose }, 'Done'))
        : React.createElement('form', { onSubmit: submit },
            React.createElement('label', { style:{fontSize:'13px', fontWeight:600, color:'#374151'} }, 'Current password'),
            React.createElement('input', { type:'password', required:true, value:current, style:inp,
              onChange: e => setCurrent(e.target.value) }),
            React.createElement('label', { style:{fontSize:'13px', fontWeight:600, color:'#374151', display:'block', marginTop:'12px'} },
              'New password'),
            React.createElement('input', { type:'password', required:true, value:next, style:inp,
              onChange: e => setNext(e.target.value) }),
            React.createElement('label', { style:{fontSize:'13px', fontWeight:600, color:'#374151', display:'block', marginTop:'12px'} },
              'Confirm new password'),
            React.createElement('input', { type:'password', required:true, value:confirm, style:inp,
              onChange: e => setConfirm(e.target.value) }),
            err && React.createElement('p', { style:{color:'#dc2626', fontSize:'13px', margin:'10px 0 0'} }, err),
            React.createElement('div', { style:{display:'flex', gap:'10px', marginTop:'20px', justifyContent:'flex-end'} },
              React.createElement('button', { type:'button', style: btn(false), onClick: onClose }, 'Cancel'),
              React.createElement('button', { type:'submit',  style: btn(true),  disabled: busy },
                busy ? 'Saving…' : 'Change Password')))
    )
  );
}

// ── User management (admin only) ──────────────────────────────────────────────
function UsersAdmin() {
  const [users,       setUsers]       = useState([]);
  const [adding,      setAdding]      = useState(false);
  const [newEmail,    setNewEmail]    = useState('');
  const [newPass,     setNewPass]     = useState('');
  const [newIsAdmin,  setNewIsAdmin]  = useState(false);
  const [resetId,     setResetId]     = useState(null);
  const [resetPass,   setResetPass]   = useState('');
  const [saving,      setSaving]      = useState(false);
  const [msg,         setMsg]         = useState('');
  const [welcoming,   setWelcoming]   = useState({});   // {userId: 'sending'|'sent'|'error'}

  function load() {
    apiFetch('/api/admin/users').then(data => setUsers(data || [])).catch(()=>{});
  }
  useEffect(load, []);

  function flash(m) { setMsg(m); setTimeout(()=>setMsg(''), 4000); }

  async function addUser(e) {
    e.preventDefault();
    setSaving(true);
    try {
      await apiFetch('/api/admin/users', {
        method:'POST',
        body: JSON.stringify({email:newEmail.trim(), password:newPass, is_admin: newIsAdmin?1:0})
      });
      setAdding(false); setNewEmail(''); setNewPass(''); setNewIsAdmin(false);
      load(); flash('✓ User added');
    } catch(err) {
      flash('Error: ' + err.message);
    }
    setSaving(false);
  }

  async function toggleActive(u) {
    await apiFetch(`/api/admin/users/${u.id}`, {
      method:'PUT', body: JSON.stringify({is_active: u.is_active ? 0 : 1})
    }).catch(()=>{});
    load();
  }

  async function toggleAdmin(u) {
    await apiFetch(`/api/admin/users/${u.id}`, {
      method:'PUT', body: JSON.stringify({is_admin: u.is_admin ? 0 : 1})
    }).catch(()=>{});
    load();
  }

  async function resetPassword(e) {
    e.preventDefault();
    if (!resetPass) return;
    await apiFetch(`/api/admin/users/${resetId}`, {
      method:'PUT', body: JSON.stringify({password: resetPass})
    }).catch(()=>{});
    setResetId(null); setResetPass('');
    flash('✓ Password updated');
  }

  async function deleteUser(u) {
    if (!confirm(`Remove ${u.email}? This cannot be undone.`)) return;
    await apiFetch(`/api/admin/users/${u.id}`, {method:'DELETE'}).catch(()=>{});
    load(); flash('✓ User removed');
  }

  async function sendWelcome(u) {
    setWelcoming(w => ({...w, [u.id]: 'sending'}));
    try {
      await apiFetch(`/api/admin/users/${u.id}/send-welcome`, {method:'POST'});
      setWelcoming(w => ({...w, [u.id]: 'sent'}));
      flash(`✓ Welcome email sent to ${u.email}`);
    } catch(err) {
      setWelcoming(w => ({...w, [u.id]: 'error'}));
      flash('Email error: ' + err.message);
    }

    React.createElement('div', {className:'flex items-center justify-between mb-6'},
      React.createElement('h2', {className:'text-xl font-bold text-gray-800'}, '👤 User Management'),
      React.createElement('button', {
        onClick:()=>setAdding(true),
        className:'flex items-center gap-2 bg-blue-600 text-white px-4 py-2 rounded-lg text-sm font-semibold hover:bg-blue-700'
      }, '+ Add User')
    ),

    msg && React.createElement('div', {className:'mb-4 p-3 rounded-lg bg-green-50 text-green-700 text-sm font-medium border border-green-200'}, msg),

    // Add user form
    adding && React.createElement('form', {onSubmit:addUser,
      className:'mb-6 p-5 bg-blue-50 rounded-xl border border-blue-100'
    },
      React.createElement('h3', {className:'font-semibold text-gray-700 mb-4'}, 'New User'),
      React.createElement('div', {className:'grid grid-cols-1 sm:grid-cols-2 gap-3 mb-3'},
        React.createElement('div', null,
          React.createElement('label', {className:'block text-xs font-medium text-gray-500 mb-1'}, 'Email'),
          React.createElement('input', {type:'email', value:newEmail, onChange:e=>setNewEmail(e.target.value),
            required:true, placeholder:'user@specformbc.com', className:inputCls+' w-full'})
        ),
        React.createElement('div', null,
          React.createElement('label', {className:'block text-xs font-medium text-gray-500 mb-1'}, 'Temporary Password'),
          React.createElement('input', {type:'text', value:newPass, onChange:e=>setNewPass(e.target.value),
            required:true, placeholder:'e.g. Specform2026!', className:inputCls+' w-full'})
        )

      React.createElement('label', {className:'flex items-center gap-2 text-sm text-gray-600 mb-4 cursor-pointer'},
        React.createElement('input', {type:'checkbox', checked:newIsAdmin, onChange:e=>setNewIsAdmin(e.target.checked)}),
        'Administrator (can manage users)'
      ),
      React.createElement('div', {className:'flex gap-2'},
        React.createElement('button', {type:'submit', disabled:saving,
          className:'bg-blue-600 text-white px-4 py-2 rounded-lg text-sm font-semibold hover:bg-blue-700 disabled:opacity-50'
        }, saving ? 'Saving…' : 'Add User'),

// ── App shell ─────────────────────────────────────────────────────────────────
function App() {
  // ── Auth state ────────────────────────────────────────────────────────────
  const [user,         setUser]         = useState(null);
  const [authChecked,  setAuthChecked]  = useState(false);
  const [splashFading, setSplashFading] = useState(false);
  const [splashGone,   setSplashGone]   = useState(false);

  React.useEffect(() => {
    const token = localStorage.getItem('auth_token');
    if (!token) { setAuthChecked(true); return; }
    fetch('/api/auth/me', {headers:{'Authorization':'Bearer '+token}})
      .then(r => r.ok ? r.json() : null)
      .then(u => {
        if (u) {
          setUser(u);
          // Auto-fade splash after brief display
          setTimeout(() => setSplashFading(true), 2000);
          setTimeout(() => setSplashGone(true),   2800);
        } else {
          localStorage.removeItem('auth_token');
        }
        setAuthChecked(true);
      })
      .catch(() => { localStorage.removeItem('auth_token'); setAuthChecked(true); });
  }, []);

  function handleLogin(data) {
    setUser(data);
    setSplashFading(false);
    setSplashGone(false);
    setTimeout(() => setSplashFading(true), 800);
    setTimeout(() => setSplashGone(true),   1600);
  }

  function logout() {
    localStorage.removeItem('auth_token');
    setUser(null);
    setSplashFading(false);
    setSplashGone(false);
    setAuthChecked(true);
  }
  const [tab, setTab]         = useState('sales');
  const [modal, setModal]     = useState(null);
  const [showChgPw, setShowChgPw] = useState(false);
  const [modalCfg, setModalCfg] = useState(RMAX_CFG);
  const [refresh, setRefresh] = useState(0);
  const [syncing, setSyncing] = useState(false);
  const [syncMsg, setSyncMsg] = useState('');
  function openEdit(q, cfg) {
    // Lock body scroll so nothing can jump while modal is open
    const y = window.scrollY;
    document.body.style.position = 'fixed';
    document.body.style.top      = `-${y}px`;
    document.body.style.width    = '100%';
    setModal(q);
    setModalCfg(cfg || RMAX_CFG);
  }
  function closeModal(saved) {
    // Restore body scroll before any React state changes
    const y = Math.abs(parseInt(document.body.style.top || '0', 10));
    document.body.style.position = '';
    document.body.style.top      = '';
    document.body.style.width    = '';
    window.scrollTo(0, y);
    setModal(null);
    if (saved) setRefresh(r => r+1);
  }

  function doRefresh(cfg) {
    setSyncing(true);
    setSyncMsg('');
    apiFetch(cfg.syncUrl, {method:'POST'})
      .then(data => {
        setSyncMsg(data.message || (data.inserted > 0
          ? `✓ ${data.inserted} new quote${data.inserted===1?'':'s'} imported`
          : '✓ No new quotes'));
        setRefresh(r => r+1);
      })
      .catch(e => {
        setSyncMsg('Refresh failed: ' + e.message);
        setRefresh(r => r+1);
      })
      .finally(() => {
        setSyncing(false);
        setTimeout(() => setSyncMsg(''), 10000);
      });
  }

  return React.createElement('div', {className:'min-h-screen'},
    // Splash / Login overlay — always shown until splashGone
    !splashGone && React.createElement('div', {
      className: 'splash' + (splashFading ? ' fade-out' : ''),
      style: { pointerEvents: splashFading ? 'none' : 'auto' }

        React.createElement('img', {
