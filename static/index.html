<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>SPECFORM Sales Tracker</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/prop-types@15.8.1/prop-types.min.js"></script>
<script src="https://unpkg.com/recharts@2.8.0/umd/Recharts.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>
<style>
  body { font-family: 'Segoe UI', system-ui, sans-serif; background:#f1f5f9; }
  .status-Won       { background:#dcfce7; color:#166534; }
  .status-Verbal    { background:#fef9c3; color:#854d0e; }
  .status-Lost      { background:#fee2e2; color:#991b1b; }
  .status-Duplicate { background:#f3f4f6; color:#6b7280; }
  .status-Unlikely  { background:#ede9fe; color:#5b21b6; }
  .status-NotAwarded{ background:#ffedd5; color:#9a3412; }
  .modal-backdrop   { position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;display:flex;align-items:center;justify-content:center; }
  .modal            { background:#fff;border-radius:12px;padding:28px;width:min(680px,95vw);max-height:90vh;overflow-y:auto; }
  input, select, textarea { border:1px solid #d1d5db;border-radius:6px;padding:6px 10px;width:100%;font-size:14px;outline:none; }
  input:focus, select:focus, textarea:focus { border-color:#2563eb;box-shadow:0 0 0 2px #bfdbfe; }
  .btn { padding:7px 16px;border-radius:7px;font-size:14px;font-weight:500;cursor:pointer;border:none; }
  .btn-primary { background:#1d4ed8;color:#fff; }
  .btn-primary:hover { background:#1e40af; }
  .btn-ghost { background:#f1f5f9;color:#374151; }
  .btn-ghost:hover { background:#e2e8f0; }
  .btn-danger { background:#dc2626;color:#fff; }
  .btn-danger:hover { background:#b91c1c; }
  .card { background:#fff;border-radius:12px;padding:20px;box-shadow:0 1px 3px rgba(0,0,0,.07); }
  .kpi-card { background:#fff;border-radius:12px;padding:20px 24px;box-shadow:0 1px 3px rgba(0,0,0,.07);border-left:4px solid; }
  tr:hover td { background:#f8fafc; }
  .tab { padding:8px 18px;border-radius:8px;cursor:pointer;font-weight:500;font-size:14px;white-space:nowrap; }
  .tab-active { background:#1d4ed8;color:#fff; }
  .tab-inactive { color:#64748b; }
  .tab-inactive:hover { background:#e2e8f0; }
  /* ── Mobile ── */
  .tabs-scroll { overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none; }
  .tabs-scroll::-webkit-scrollbar { display:none; }
  @media (max-width:640px) {
    .tab { padding:7px 12px;font-size:13px; }
    .modal { padding:16px; }
    .kpi-card { padding:12px 14px; }
    .kpi-card .text-2xl { font-size:1.2rem; }
  }
</style>
</head>
<body>
<div id="root"></div>
<script>
const { useState, useEffect, useCallback, useRef } = React;
const { BarChart, Bar, XAxis, YAxis, CartesianGrid, Tooltip, Legend, ResponsiveContainer, PieChart, Pie, Cell, ComposedChart, Area, Line, ReferenceLine, LabelList } = Recharts;

const API = '';
const STATUS_OPTIONS = ['Won','Verbal','Lost','Not Awarded','Unlikely','Duplicate'];
const STATUS_COLORS = { Won:'#16a34a', Verbal:'#ca8a04', Lost:'#dc2626', 'Not Awarded':'#ea580c', Unlikely:'#7c3aed', Duplicate:'#6b7280' };
const fmt = n => n == null ? '-' : '$' + Number(n).toLocaleString('en-US', {minimumFractionDigits:0,maximumFractionDigits:0});
const fmtDate = s => {
  if (!s) return '';
  const [y,m,d] = s.slice(0,10).split('-');
  return `${m}/${d}/${y}`;
};

function fireConfetti() {
  // Two cannons from the bottom corners
  const opts = { particleCount:60, spread:70, startVelocity:55, ticks:200,
                 colors:['#16a34a','#22c55e','#4ade80','#fbbf24','#f59e0b','#ffffff','#bbf7d0'] };
  confetti({ ...opts, origin:{x:0.1, y:1} });
  confetti({ ...opts, origin:{x:0.9, y:1} });
  setTimeout(() => {
    confetti({ ...opts, particleCount:40, spread:50, startVelocity:40, origin:{x:0.5, y:0.9} });
  }, 250);
}

// ── Field config ──────────────────────────────────────────────────────────────
const FIELDS = [
  {key:'status',       label:'Status',        type:'select'},
  {key:'date_received',label:'Date Received', type:'text'},
  {key:'date_quoted',  label:'Date Quoted',   type:'text'},
  {key:'sent_to',      label:'Sent To',       type:'text'},
  {key:'subject',      label:'Subject',       type:'text'},
  {key:'job_name',     label:'Job Name',      type:'text'},
  {key:'customer',     label:'Customer',      type:'text'},
  {key:'location',     label:'Location',      type:'text'},
  {key:'product',      label:'Product',       type:'textarea'},
  {key:'price',        label:'Price',         type:'text'},
  {key:'quantities',   label:'Quantities',    type:'text'},
  {key:'amount',       label:'Amount ($)',    type:'number'},
  {key:'close_date',   label:'Close Date',    type:'text'},
  {key:'est_freight',  label:'Est. Freight',  type:'text'},
  {key:'lead_time',    label:'Lead Time',     type:'text'},
  {key:'notes',        label:'Notes',         type:'textarea'},
];

// ── API helpers ───────────────────────────────────────────────────────────────
async function apiFetch(path, opts={}) {
  const res = await fetch(API + path, { headers:{'Content-Type':'application/json'}, ...opts });
  if (!res.ok) throw new Error(await res.text());
  return res.json();
}

// ── Status badge ──────────────────────────────────────────────────────────────
function StatusBadge({ status }) {
  if (!status) return React.createElement('span', {className:'text-gray-400 text-xs'}, '—');
  const cls = 'status-' + status.replace(' ','');
  return React.createElement('span', {
    className: `text-xs font-semibold px-2 py-0.5 rounded-full ${cls}`
  }, status);
}

// ── Quote Modal ───────────────────────────────────────────────────────────────
function QuoteModal({ quote, onClose, onSave }) {
  const [form, setForm] = useState(quote || {});
  const [saving, setSaving] = useState(false);

  const set = (k,v) => setForm(f => ({...f,[k]:v}));

  async function save() {
    setSaving(true);
    try {
      const body = {...form, amount: form.amount ? parseFloat(form.amount) : null};
      const wasWon = quote && quote.status === 'Won';
      if (form.id) {
        await apiFetch(`/api/quotes/${form.id}`, {method:'PUT', body:JSON.stringify(body)});
      } else {
        await apiFetch('/api/quotes', {method:'POST', body:JSON.stringify(body)});
      }
      if (body.status === 'Won' && !wasWon) fireConfetti();
      onSave();
    } catch(e) { alert('Save failed: ' + e.message); }
    setSaving(false);
  }

  return React.createElement('div', {className:'modal-backdrop', onClick:e=>e.target===e.currentTarget&&onClose()},
    React.createElement('div', {className:'modal'},
      React.createElement('div', {className:'flex justify-between items-center mb-5'},
        React.createElement('h2', {className:'text-lg font-bold text-gray-800'}, form.id ? 'Edit Quote' : 'New Quote'),
        React.createElement('button', {onClick:onClose, className:'text-gray-400 hover:text-gray-600 text-2xl leading-none'}, '×')
      ),
      React.createElement('div', {className:'grid grid-cols-1 sm:grid-cols-2 gap-3'},
        FIELDS.map(f => {
          const val = form[f.key] ?? '';
          let el;
          if (f.type === 'select') {
            el = React.createElement('select', {value:val, onChange:e=>set(f.key,e.target.value)},
              React.createElement('option', {value:''},'— None —'),
              STATUS_OPTIONS.map(s => React.createElement('option',{key:s,value:s},s))
            );
          } else if (f.type === 'textarea') {
            el = React.createElement('textarea', {value:val, rows:2, onChange:e=>set(f.key,e.target.value)});
          } else {
            el = React.createElement('input', {type:f.type==='number'?'number':'text', value:val, onChange:e=>set(f.key,e.target.value)});
          }
          const wide = f.type==='textarea' || f.key==='subject' || f.key==='product';
          return React.createElement('div', {key:f.key, className:wide?'col-span-2':'col-span-1'},
            React.createElement('label', {className:'block text-xs font-medium text-gray-500 mb-1'}, f.label),
            el
          );
        })
      ),
      React.createElement('div', {className:'flex justify-end gap-2 mt-6'},
        React.createElement('button', {className:'btn btn-ghost', onClick:onClose}, 'Cancel'),
        React.createElement('button', {className:'btn btn-primary', onClick:save, disabled:saving},
          saving ? 'Saving…' : 'Save Quote')
      )
    )
  );
}

// ── Confirm dialog ────────────────────────────────────────────────────────────
function Confirm({ message, onYes, onNo }) {
  return React.createElement('div', {className:'modal-backdrop'},
    React.createElement('div', {className:'modal', style:{maxWidth:380}},
      React.createElement('p', {className:'text-gray-700 mb-5'}, message),
      React.createElement('div', {className:'flex justify-end gap-2'},
        React.createElement('button', {className:'btn btn-ghost', onClick:onNo}, 'Cancel'),
        React.createElement('button', {className:'btn btn-danger', onClick:onYes}, 'Delete')
      )
    )
  );
}

// ── Dashboard view ────────────────────────────────────────────────────────────
function Dashboard() {
  const [data, setData]         = useState(null);
  const [selMonth, setSelMonth] = useState('all');
  useEffect(() => { apiFetch('/api/dashboard').then(setData).catch(console.error); }, []);
  if (!data) return React.createElement('div', {className:'p-8 text-gray-400'}, 'Loading…');

  const { totals, by_location, by_month, by_status } = data;

  // Build month lookup and sorted option list
  const monthMap = {};
  by_month.forEach(r => { monthMap[r.month] = r; });
  const monthOptions = [...by_month].reverse(); // most recent first

  // Active stats — either a specific month or all-time totals
  const active = selMonth !== 'all' && monthMap[selMonth]
    ? {
        total_amount:  monthMap[selMonth].total,
        total_quotes:  monthMap[selMonth].total_quotes,
        won_amount:    monthMap[selMonth].won,
        won_count:     monthMap[selMonth].won_count,
        verbal_amount: monthMap[selMonth].verbal,
        verbal_count:  monthMap[selMonth].verbal_count,
        lost_amount:   monthMap[selMonth].lost,
        lost_count:    monthMap[selMonth].lost_count,
      }
    : totals;

  // Human-readable month label e.g. "Jul 2026"
  const monthLabel = selMonth !== 'all' && selMonth
    ? new Date(selMonth + '-02').toLocaleDateString('en-US',{month:'long',year:'numeric'})
    : 'All Time';

  const kpis = [
    {label:'Total Quoted', value:fmt(active.total_amount),   sub:`${active.total_quotes} quotes`,         color:'#2563eb'},
    {label:'Won',          value:fmt(active.won_amount),     sub:`${active.won_count} deals`,             color:'#16a34a'},
    {label:'Verbal',       value:fmt(active.verbal_amount),  sub:`${active.verbal_count} pending`,        color:'#ca8a04'},
    {label:'Lost',         value:fmt(active.lost_amount||0), sub:`${active.lost_count||0} lost`,          color:'#dc2626'},
  ];

  // Build a full 12-month rolling grid (past 6 + current + future 5) filled with data
  const today = new Date();
  const currentYM = today.toISOString().slice(0,7); // YYYY-MM
  const allMonths = Array.from({length:12}, (_,i) => {
    const d = new Date(today.getFullYear(), today.getMonth() - 6 + i, 1);
    const ym = d.toISOString().slice(0,7);
    const label = d.toLocaleDateString('en-US',{month:'short',year:'2-digit'});
    return {month:ym, name:label, won:0, verbal:0};
  });
  const projData = allMonths.map(m => ({
    ...m,
    won:    monthMap[m.month] ? (monthMap[m.month].won    || 0) : 0,
    verbal: monthMap[m.month] ? (monthMap[m.month].verbal || 0) : 0,
    isFuture: m.month > currentYM,
    isCurrent: m.month === currentYM,
  }));
  const totalWon    = projData.reduce((s,r) => s + r.won,    0);
  const totalVerbal = projData.reduce((s,r) => s + r.verbal, 0);
  const totalAll    = projData.reduce((s,r) => s + (r.total||0), 0);

  return React.createElement('div', {className:'space-y-6'},
    // KPI row with month selector
    React.createElement('div', {className:'space-y-3'},
      React.createElement('div', {className:'flex items-center justify-between'},
        React.createElement('span', {className:'text-sm font-semibold text-gray-500 uppercase tracking-wide'},
          monthLabel
        ),
        React.createElement('select', {
          value: selMonth,
          onChange: e => setSelMonth(e.target.value),
          style:{fontSize:'13px', padding:'4px 8px', borderRadius:'7px', border:'1px solid #d1d5db',
                 background:'#fff', color:'#374151', cursor:'pointer', width:'140px'},
        },
          React.createElement('option', {value:'all'}, 'All Time'),
          monthOptions.map(m => {
            const label = new Date(m.month + '-02').toLocaleDateString('en-US',{month:'short',year:'numeric'});
            return React.createElement('option', {key:m.month, value:m.month}, label);
          })
        )
      ),
      React.createElement('div', {className:'grid grid-cols-2 md:grid-cols-4 gap-4'},
        kpis.map(k => React.createElement('div', {key:k.label, className:'kpi-card', style:{borderLeftColor:k.color}},
          React.createElement('div', {className:'text-xs font-semibold text-gray-500 uppercase tracking-wide mb-1'}, k.label),
          React.createElement('div', {className:'text-2xl font-bold text-gray-800'}, k.value),
          React.createElement('div', {className:'text-xs text-gray-400 mt-0.5'}, k.sub)
        ))
      )
    ),

    // 12-Month Rolling Sales Projection (full width)
    React.createElement('div', {className:'card'},
      React.createElement('div', {className:'flex items-center justify-between mb-1'},
        React.createElement('h3', {className:'font-semibold text-gray-700'}, '12-Month Rolling Sales Activity'),
        React.createElement('div', {className:'flex flex-wrap items-center gap-2 text-xs text-gray-500'},
          React.createElement('span', {}, React.createElement('strong', {className:'text-blue-600'}, fmt(totalAll)), ' Total Quoted'),
          React.createElement('span', {}, React.createElement('strong', {className:'text-green-700'}, fmt(totalWon)), ' Won'),
          React.createElement('span', {}, React.createElement('strong', {className:'text-yellow-600'}, fmt(totalVerbal)), ' Verbal')
        )
      ),
      React.createElement('p', {className:'text-xs text-gray-400 mb-4'}, 'Quote amounts by month received · Won and Verbal highlighted'),
      React.createElement(ResponsiveContainer, {width:'100%', height:280},
        React.createElement(ComposedChart, {data:projData, margin:{top:10,right:20,left:10,bottom:5}},
          React.createElement(CartesianGrid, {strokeDasharray:'3 3', stroke:'#f0f0f0'}),
          React.createElement(XAxis, {dataKey:'name', tick:{fontSize:11}}),
          React.createElement(YAxis, {tickFormatter:v=>'$'+Math.round(v/1000)+'k', tick:{fontSize:11}, width:52}),
          React.createElement(Tooltip, {
            formatter:(v,n)=>[fmt(v),n],
            labelFormatter:(label,payload) => {
              if (!payload || !payload[0]) return label;
              const d = payload[0].payload;
              return label + (d.isCurrent ? ' — Current Month' : d.isFuture ? ' — Projected' : ' — Actual');
            }
          }),
          React.createElement(Legend),
          // "Today" reference line
          React.createElement(ReferenceLine, {
            x: new Date(today).toLocaleDateString('en-US',{month:'short',year:'2-digit'}),
            stroke:'#94a3b8', strokeDasharray:'4 3', strokeWidth:1.5,
            label:{value:'Today', position:'top', fontSize:10, fill:'#94a3b8'}
          }),
          React.createElement(Bar, {
            dataKey:'total', name:'Total Quoted', fill:'#bfdbfe', radius:[4,4,0,0]
          }),
          React.createElement(Line, {
            dataKey:'won', name:'Won', stroke:'#16a34a',
            strokeWidth:2.5, dot:{r:4, fill:'#16a34a', strokeWidth:0}, activeDot:{r:6},
            type:'monotone'
          }),
          React.createElement(Line, {
            dataKey:'verbal', name:'Verbal', stroke:'#ca8a04',
            strokeWidth:2.5, strokeDasharray:'6 3', dot:{r:4, fill:'#ca8a04', strokeWidth:0}, activeDot:{r:6},
            type:'monotone'
          })
        )
      )
    ),

    // Bottom row: location chart + status table
    React.createElement('div', {className:'grid grid-cols-1 lg:grid-cols-2 gap-6'},
      // By location
      React.createElement('div', {className:'card'},
        React.createElement('h3', {className:'font-semibold text-gray-700 mb-4'}, 'Pipeline by Location'),
        React.createElement(ResponsiveContainer, {width:'100%', height:260},
          React.createElement(BarChart, {data:by_location.slice(0,10), layout:'vertical', margin:{top:5,right:10,left:80,bottom:5}},
            React.createElement(CartesianGrid, {strokeDasharray:'3 3', stroke:'#f0f0f0'}),
            React.createElement(XAxis, {type:'number', tickFormatter:v=>'$'+Math.round(v/1000)+'k', tick:{fontSize:11}}),
            React.createElement(YAxis, {type:'category', dataKey:'location', tick:{fontSize:10}, width:80}),
            React.createElement(Tooltip, {formatter:(v,n)=>[fmt(v),n]}),
            React.createElement(Legend),
            React.createElement(Bar, {dataKey:'total',  name:'Total Quoted', fill:'#3b82f6', radius:[0,4,4,0]}),
            React.createElement(Bar, {dataKey:'won',    name:'Won',          fill:'#16a34a', radius:[0,4,4,0]}),
            React.createElement(Bar, {dataKey:'verbal', name:'Verbal',       fill:'#ca8a04', radius:[0,4,4,0]})
          )
        )
      ),

      // Status breakdown table
      React.createElement('div', {className:'card'},
        React.createElement('h3', {className:'font-semibold text-gray-700 mb-3'}, 'Status Breakdown'),
        React.createElement('table', {className:'w-full text-sm'},
          React.createElement('thead', {},
            React.createElement('tr', {className:'text-left text-xs text-gray-500 uppercase border-b'},
              React.createElement('th', {className:'pb-2 pr-4'}, 'Status'),
              React.createElement('th', {className:'pb-2 pr-4 text-right'}, 'Count'),
              React.createElement('th', {className:'pb-2 text-right'}, 'Amount')
            )
          ),
          React.createElement('tbody', {},
            by_status.map(r => React.createElement('tr', {key:r.status, className:'border-b border-gray-50'},
              React.createElement('td', {className:'py-2 pr-4'}, React.createElement(StatusBadge, {status:r.status})),
              React.createElement('td', {className:'py-2 pr-4 text-right text-gray-600'}, r.count),
              React.createElement('td', {className:'py-2 text-right font-medium text-gray-700'}, fmt(r.amount))
            ))
          )
        )
      )
    )
  );
}

// ── Quotes list view ──────────────────────────────────────────────────────────
// Normalize state abbreviations for grouping/filtering
const normLoc = s => (s || '(No Location)').replace(/,?\s+([a-zA-Z]{2})$/, (_, st) => ', ' + st.toUpperCase());

function QuoteList({ onEdit, refresh, onRefresh, syncing, syncMsg }) {
  const [quotes, setQuotes]       = useState([]);
  const [loading, setLoading]     = useState(true);
  const [filters, setFilters]     = useState({status:'All', search:''});
  const [locations, setLocs]      = useState([]);
  const [selectedLocs, setSelLocs]= useState(new Set());
  const [locOpen, setLocOpen]     = useState(false);
  const [deleting, setDeleting]   = useState(null);
  const searchRef  = useRef();
  const locDropRef = useRef();

  // Close location dropdown on outside click
  useEffect(() => {
    function onDown(e) { if (locDropRef.current && !locDropRef.current.contains(e.target)) setLocOpen(false); }
    document.addEventListener('mousedown', onDown);
    return () => document.removeEventListener('mousedown', onDown);
  }, []);

  function toggleLoc(loc) {
    setSelLocs(prev => { const n = new Set(prev); n.has(loc) ? n.delete(loc) : n.add(loc); return n; });
  }

  // silent=true → update quotes in place without showing spinner or losing scroll
  const load = useCallback(async (silent = false) => {
    const savedScroll = window.scrollY;
    if (!silent) setLoading(true);
    const params = new URLSearchParams();
    if (filters.status !== 'All') params.set('status', filters.status);
    if (filters.search)           params.set('search', filters.search);
    const data = await apiFetch('/api/quotes?' + params);
    setQuotes(data);
    if (!silent) setLoading(false);
    if (silent) requestAnimationFrame(() => window.scrollTo(0, savedScroll));
  }, [filters]);

  // Filter changes: full load with spinner
  useEffect(() => { load(false); }, [load]);
  // Parent refresh (modal save / sync button): silent in-place update
  const prevRefresh = useRef(refresh);
  useEffect(() => {
    if (prevRefresh.current === refresh) return;
    prevRefresh.current = refresh;
    load(true);
  // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [refresh]);
  useEffect(() => {
    apiFetch('/api/dashboard').then(d => setLocs(d.locations)).catch(()=>{});
  }, []);

  async function doDelete(id) {
    await apiFetch(`/api/quotes/${id}`, {method:'DELETE'});
    setDeleting(null);
    load();
  }

  const setFilter = (k,v) => setFilters(f => ({...f,[k]:v}));

  return React.createElement('div', {className:'space-y-4'},
    // Toolbar
    React.createElement('div', {className:'flex flex-wrap gap-2 items-center'},
      React.createElement('input', {
        ref: searchRef,
        type:'text', placeholder:'Search quotes…',
        className:'px-3 py-2 border border-gray-200 rounded-lg text-sm w-56',
        defaultValue: filters.search,
        onKeyDown: e => e.key==='Enter' && setFilter('search', e.target.value),
        onBlur: e => setFilter('search', e.target.value)
      }),
      React.createElement('select', {
        value:filters.status,
        onChange:e=>setFilter('status',e.target.value),
        className:'px-3 py-2 border border-gray-200 rounded-lg text-sm'
      },
        ['All','Won','Verbal','Lost','Not Awarded','Unlikely','Duplicate'].map(s =>
          React.createElement('option',{key:s,value:s},s)
        )
      ),
      // Location multi-select dropdown
      React.createElement('div', {ref:locDropRef, style:{position:'relative'}},
        React.createElement('button', {
          className:'px-3 py-2 border border-gray-200 rounded-lg text-sm flex items-center gap-1 bg-white',
          onClick:()=>setLocOpen(o=>!o)
        },
          selectedLocs.size === 0 ? 'All Locations'
          : selectedLocs.size === 1 ? [...selectedLocs][0]
          : `${selectedLocs.size} locations`,
          React.createElement('span', {className:'text-gray-400 ml-1'}, '▾')
        ),
        locOpen && React.createElement('div', {
          className:'absolute top-full left-0 mt-1 bg-white border border-gray-200 rounded-lg shadow-lg z-30 py-1',
          style:{minWidth:'220px', maxHeight:'320px', overflowY:'auto'}
        },
          // "All" option clears selection
          React.createElement('label', {className:'flex items-center px-3 py-1.5 hover:bg-gray-50 cursor-pointer text-sm gap-0'},
            React.createElement('input', {
              type:'checkbox', checked:selectedLocs.size===0,
              onChange:()=>setSelLocs(new Set()),
              style:{width:'16px', height:'16px', flexShrink:0, margin:'0 10px 0 0', cursor:'pointer'}
            }),

                  borderRight:  row.thickBorder ? '2.5px solid #166534' : '1px solid #9ca3af',
                  fontWeight: row.labelWeight || (row.bold ? '600' : '400'),
                  color: row.labelColor || '#374151', background: rowBg,
                }}, row.label),
                repProducts.map(p => {
                  const n = Math.round(row.vals(p) || 0);
                  const neg = n < 0;
                  const str = '$' + Math.abs(n).toLocaleString('en-US');
                  const color = row.valColor ? row.valColor : neg ? '#dc2626' : '#374151';
                  return React.createElement('td', {key:p, style:{
                    padding:'9px 16px', textAlign:'right', fontSize:'13px',
                    fontWeight: row.valWeight || (row.bold ? '600' : '400'),
                    color,
                    borderTop:    row.thickBorder ? '2.5px solid #166534' : '1px solid #9ca3af',
                    borderBottom: row.thickBorder ? '2.5px solid #166534' : '1px solid #9ca3af',
                    borderRight:  row.thickBorder ? '2.5px solid #166534' : '1px solid #9ca3af',
                    background: rowBg,
                  }}, neg ? '('+str+')' : str);
                })
              );
            })
          )
        )
      );
    })()
  );
}

// ── App shell ─────────────────────────────────────────────────────────────────
function App() {
  const [tab, setTab]       = useState('quotes');
  const [modal, setModal]   = useState(null); // null | 'new' | {quote object}
  const [refresh, setRefresh] = useState(0);
  const [syncing, setSyncing] = useState(false);
  const [syncMsg, setSyncMsg] = useState('');

  function openEdit(q) { setModal(q); }
  function openNew()   { setModal({}); }
  function closeModal(saved) {
    setModal(null);
    if (saved) setRefresh(r => r+1);
  }

  function doRefresh() {
    setSyncing(true);
    setSyncMsg('');
    apiFetch('/api/sync', {method:'POST'})
      .then(data => {
        setSyncMsg(data.inserted > 0
          ? `✓ ${data.inserted} new quote${data.inserted===1?'':'s'} imported`
          : data.skipped > 0 ? '✓ Already up to date' : '✓ No new quotes');
        setRefresh(r => r+1);
      })
      .catch(() => {
        setSyncMsg('Refresh failed');
        setRefresh(r => r+1);
      })
      .finally(() => {
        setSyncing(false);
        setTimeout(() => setSyncMsg(''), 4000);
      });
  }

  return React.createElement('div', {className:'min-h-screen'},
    // Header
    React.createElement('header', {className:'bg-[#1F4E79] text-white shadow'},
      React.createElement('div', {className:'max-w-7xl mx-auto px-4 sm:px-6 py-3 flex items-center justify-between'},
        React.createElement('div', {className:'flex items-center gap-4'},
          // Specform logo PNG (transparent bg, dark marks → invert to white for dark header)
          React.createElement('img', {src:'/static/logo.png', alt:'Specform Building Components', style:{height:'32px', flexShrink:0, filter:'brightness(0) invert(1)'}}),
          // RMAX Quote Tracker label
          React.createElement('div', {className:'border-l border-blue-400 pl-4 ml-1'},
            React.createElement('div', {className:'text-base sm:text-lg font-bold tracking-tight leading-none'}, 'SPECFORM Sales Tracker')
          )
        ),
        null
      )
    ),

    // Nav tabs
    React.createElement('div', {className:'bg-white border-b shadow-sm'},
      React.createElement('div', {className:'tabs-scroll'},
        React.createElement('div', {className:'max-w-7xl mx-auto px-4 sm:px-6 flex gap-2 py-2'},
        React.createElement('button', {
          className:`tab ${tab==='quotes'?'tab-active':'tab-inactive'}`,
          onClick:()=>setTab('quotes')
        }, '📋 RMAX Quotes'),
        React.createElement('button', {
          className:`tab ${tab==='dashboard'?'tab-active':'tab-inactive'}`,
          onClick:()=>setTab('dashboard')
        }, '📊 RMAX Dashboard'),
        React.createElement('button', {
          className:`tab ${tab==='sales'?'tab-active':'tab-inactive'}`,
          onClick:()=>setTab('sales')
        }, '📈 SPECFORM Overall Sales')
      ))
    ),

    // Content
    React.createElement('main', {className:'max-w-7xl mx-auto px-4 sm:px-6 py-6'},
      tab === 'dashboard' ? React.createElement(Dashboard, {key:refresh})
      : tab === 'sales'   ? React.createElement(SalesTab)
      :                     React.createElement(QuoteList, {refresh, onEdit:openEdit, onRefresh:doRefresh, syncing, syncMsg})
    ),

    // Modal
    modal !== null && React.createElement(QuoteModal, {
      quote: Object.keys(modal).length === 0 ? null : modal,
      onClose: () => closeModal(false),
      onSave:  () => closeModal(true)
    })
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
</script>
</body>
</html>
